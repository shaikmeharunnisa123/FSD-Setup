services:
  - type: web
    name: react-python-fsd-backend
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m gunicorn app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: APP_NAME
        value: Flask Backend
      - key: API_VERSION
        value: v1
